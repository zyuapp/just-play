name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-mac:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list carthage >/dev/null 2>&1 || brew install carthage

      - name: Prepare release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(python3 scripts/bump-version.py "$BUMP")"
          make setup
          git add project.yml Sources/Info.plist
          git commit -m "Release v$version"
          git tag "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/release.bundle" main "refs/tags/v$version"

      - name: Build and test
        run: make test

      - name: Restore signing credentials
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/just-play.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/apple.p8"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/just-play.p12" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

      - name: Build, sign, and notarize
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/release.sh

      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/just-play.p12" "$RUNNER_TEMP/apple.p8"

      - name: Save release source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error

      - name: Save macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-mac
          path: |
            dist/*.dmg
            dist/appcast.xml
          if-no-files-found: error

  publish:
    needs: build-mac
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore release source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source

      - name: Restore packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-mac
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.build-mac.outputs.commit }}
          TAG: ${{ needs.build-mac.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/release-source/release.bundle" \
            refs/heads/main:refs/remotes/release/main \
            "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse refs/remotes/release/main)" = "$RELEASE_COMMIT"
          REMOTE_TAG="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [ -z "$REMOTE_TAG" ]; then
            REMOTE_TAG="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          fi
          if [ -n "$REMOTE_TAG" ]; then
            test "$REMOTE_TAG" = "$RELEASE_COMMIT" || {
              echo "Remote $TAG does not identify release commit $RELEASE_COMMIT." >&2
              exit 1
            }
            git push origin refs/remotes/release/main:refs/heads/main
          else
            git push --atomic origin refs/remotes/release/main:refs/heads/main "refs/tags/$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Just Play $TAG" \
              --generate-notes \
              --draft \
              --verify-tag
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --latest
