name: JustPlay
options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
schemes:
  JustPlay:
    build:
      targets:
        JustPlay: all
    test:
      targets:
        - JustPlayTests
targets:
  JustPlay:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    settings:
      base:
        EXECUTABLE_NAME: JustPlay
        PRODUCT_BUNDLE_IDENTIFIER: com.justplay
        PRODUCT_MODULE_NAME: JustPlay
        PRODUCT_NAME: "Just Play"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - framework: Carthage/Build/VLCKit.xcframework
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Just Play
        CFBundleDisplayName: Just Play
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        SUFeedURL: https://github.com/zyuapp/just-play/releases/latest/download/appcast.xml
        SUPublicEDKey: 2PbQwcPQJgv6si1MA129T14VgfCd7Hurmav+NiC/oSo=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 21600
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: MPEG-4 Video
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.mpeg-4
          - CFBundleTypeName: Matroska Video
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.firecore.fileformat.mkv
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.firecore.fileformat.mkv
            UTTypeConformsTo:
              - public.movie
              - public.audiovisual-content
            UTTypeDescription: Matroska Video
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
              public.mime-type:
                - video/x-matroska

  JustPlayTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/JustPlayTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Just Play.app/Contents/MacOS/JustPlay"
    dependencies:
      - target: JustPlay
